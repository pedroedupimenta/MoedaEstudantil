<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Empresas Parceiras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <p><a href="index.html">← Voltar</a></p>
  <h1>Empresas Parceiras</h1>
  <div id="msg"></div>

  <form id="form">
    <input type="hidden" id="id">
    <label>Nome Fantasia <input id="nomeFantasia" required></label>
    <label>CNPJ (14 dígitos) <input id="cnpj" maxlength="14" required></label>
    <label>Email <input id="email" type="email" required></label>
    <label>Login <input id="login" required minlength="4"></label>
    <label>Senha <input id="senha" type="password" placeholder="(deixe vazio para manter na edição)"></label>
    <div class="acoes">
      <button type="submit" id="salvar">Cadastrar</button>
      <button type="button" class="sec" id="cancelar" hidden>Cancelar edição</button>
    </div>
  </form>

  <table>
    <thead>
      <tr><th>Nome Fantasia</th><th>CNPJ</th><th>Email</th><th>Login</th><th>Ações</th></tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>
</main>

<script>
const API = '/api/empresas';
const $ = id => document.getElementById(id);

function aviso(texto, tipo) {
  const m = $('msg');
  m.textContent = texto;
  m.className = tipo;
  setTimeout(() => m.className = '', 4000);
}

async function listar() {
  const empresas = await (await fetch(API)).json();
  $('lista').innerHTML = empresas.map(e => `
    <tr>
      <td>${e.nomeFantasia}</td><td>${e.cnpj}</td><td>${e.email}</td><td>${e.login}</td>
      <td>
        <button onclick="editar(${e.id})">Editar</button>
        <button class="danger" onclick="remover(${e.id})">Excluir</button>
      </td>
    </tr>`).join('');
}

async function editar(id) {
  const e = await (await fetch(`${API}/${id}`)).json();
  $('id').value = e.id;
  $('nomeFantasia').value = e.nomeFantasia;
  $('cnpj').value = e.cnpj;
  $('email').value = e.email;
  $('login').value = e.login;
  $('senha').value = '';
  $('salvar').textContent = 'Salvar alterações';
  $('cancelar').hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function remover(id) {
  if (!confirm('Excluir esta empresa?')) return;
  const r = await fetch(`${API}/${id}`, { method: 'DELETE' });
  if (r.ok) { aviso('Empresa excluída', 'ok'); listar(); }
  else aviso((await r.json()).erro, 'erro');
}

function limpar() {
  $('form').reset();
  $('id').value = '';
  $('salvar').textContent = 'Cadastrar';
  $('cancelar').hidden = true;
}

$('cancelar').addEventListener('click', limpar);

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const id = $('id').value;
  const body = {
    nomeFantasia: $('nomeFantasia').value, cnpj: $('cnpj').value,
    email: $('email').value, login: $('login').value, senha: $('senha').value
  };
  const r = await fetch(id ? `${API}/${id}` : API, {
    method: id ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (r.ok) {
    aviso(id ? 'Empresa atualizada' : 'Empresa cadastrada', 'ok');
    limpar(); listar();
  } else {
    aviso((await r.json()).erro, 'erro');
  }
});

listar();
</script>
</body>
</html>
